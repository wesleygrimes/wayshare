[package]
edition = "2024"
rust-version = "1.89"
name = "ironrdp-server"
version = "0.13.0"
authors = [
    "Devolutions Inc. <infos@devolutions.net>",
    "Teleport <goteleport.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extendable skeleton for implementing custom RDP servers"
homepage = "https://github.com/Devolutions/IronRDP"
readme = "README.md"
keywords = [
    "rdp",
    "remote-desktop",
    "network",
    "client",
    "protocol",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"
resolver = "2"

[features]
__bench = ["dep:visibility"]
default = [
    "rayon",
    "qoi",
    "qoiz",
]
egfx = ["dep:ironrdp-egfx"]
helper = [
    "dep:x509-cert",
    "dep:rustls-pemfile",
]
nscodec = ["dep:ironrdp-nscodec"]
qoi = [
    "dep:qoicoubeh",
    "ironrdp-pdu/qoi",
]
qoiz = [
    "dep:zstd-safe",
    "qoi",
    "ironrdp-pdu/qoiz",
]
rayon = ["dep:rayon"]

[lib]
name = "ironrdp_server"
path = "src/lib.rs"
test = true
doctest = true

[dependencies.zeroize]
version = "1.9"

[dependencies.anyhow]
version = "1.0"

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.ironrdp-acceptor]
version = "0.10"

[dependencies.ironrdp-ainput]
version = "0.8"

[dependencies.ironrdp-async]
version = "0.10"

[dependencies.ironrdp-cliprdr]
version = "0.7"

[dependencies.ironrdp-connector]
version = "0.10"

[dependencies.ironrdp-core]
version = "0.2"

[dependencies.ironrdp-displaycontrol]
version = "0.8"

[dependencies.ironrdp-dvc]
version = "0.8"

[dependencies.ironrdp-echo]
version = "0.4"

[dependencies.ironrdp-egfx]
version = "0.3"
optional = true

[dependencies.ironrdp-graphics]
version = "0.9"

[dependencies.ironrdp-nscodec]
version = "0.2"
features = ["encoder"]
optional = true

[dependencies.ironrdp-pdu]
version = "0.9"

[dependencies.ironrdp-rdpsnd]
version = "0.9"

[dependencies.ironrdp-svc]
version = "0.8"

[dependencies.ironrdp-tokio]
version = "0.10"
features = ["reqwest"]

[dependencies.qoicoubeh]
version = "0.5"
optional = true

[dependencies.rayon]
version = "1.12"
optional = true

[dependencies.rustls-pemfile]
version = "2.2"
optional = true

[dependencies.tokio]
version = "1"
features = [
    "net",
    "macros",
    "sync",
    "rt",
]

[dependencies.tokio-rustls]
version = "0.26"

[dependencies.tracing]
version = "0.1"
features = ["log"]

[dependencies.visibility]
version = "0.1"
optional = true

[dependencies.x509-cert]
version = "0.2"
optional = true

[dependencies.zstd-safe]
version = "7.2"
optional = true

[dev-dependencies.tokio]
version = "1"
features = ["sync"]
