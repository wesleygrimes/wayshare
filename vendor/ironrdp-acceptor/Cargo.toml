[package]
edition = "2024"
rust-version = "1.89"
name = "ironrdp-acceptor"
version = "0.10.0"
authors = [
    "Devolutions Inc. <infos@devolutions.net>",
    "Teleport <goteleport.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "State machines to drive an RDP connection acceptance sequence"
homepage = "https://github.com/Devolutions/IronRDP"
keywords = [
    "rdp",
    "remote-desktop",
    "network",
    "client",
    "protocol",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"
resolver = "2"

[lib]
name = "ironrdp_acceptor"
path = "src/lib.rs"
test = true
doctest = true

[dependencies.ironrdp-async]
version = "0.10"

[dependencies.ironrdp-connector]
version = "0.10"

[dependencies.ironrdp-core]
version = "0.2"
features = ["alloc"]

[dependencies.ironrdp-pdu]
version = "0.9"

[dependencies.ironrdp-svc]
version = "0.8"

[dependencies.tracing]
version = "0.1"
features = ["log"]
