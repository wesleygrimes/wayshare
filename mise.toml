[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"cargo:bindgen-cli" = "0.73.2"
shellcheck = "0.11.0"
actionlint = "1.7.12"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:cocogitto/cocogitto" = "7.0.0"
"aqua:orhun/git-cliff" = "2.14.2"

[tasks.setup]
description = "Install managed tools and Rust components, report missing system packages"
run = [
  "mise install",
  "rustup component add rustfmt clippy",
  "tools/check-system-deps.sh",
]

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check Rust formatting without changing files"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy, ShellCheck and actionlint"
run = [
  "cargo clippy --locked --all-targets -- -D warnings",
  "shellcheck install.sh tools/*.sh",
  "actionlint",
]

[tasks.test]
description = "Run the test suite"
run = "cargo test --locked"

[tasks."bench:media"]
description = "Measure HEVC packetization and SRTP encryption without a GPU"
run = "cargo bench --locked --bench media"

[tasks.check]
description = "Check formatting, lint and tests without rewriting files"
depends = ["fmt:check", "lint", "test"]

[tasks."check:commits"]
description = "Validate commit messages in <base>..HEAD"
usage = 'arg "<base>" help="Git revision to start after, e.g. origin/main"'
run = '''
cog check "${usage_base}..HEAD"
if git log --format=%s "${usage_base}..HEAD" | grep -Ev '^[a-z]+(\([^)]+\))?!?: '; then
  echo "commit types must be lowercase" >&2
  exit 1
fi
'''

[tasks.build]
description = "Build the dev profile, or the optimized binary with --release"
usage = 'flag "--release" help="Build the release profile"'
run = 'cargo build --locked ${usage_release:+--release}'

[tasks.audit]
description = "Check dependency advisories, licenses and sources (needs network)"
run = "cargo deny --locked check"

[tasks.changelog]
description = "Preview the unreleased release notes on stdout; writes nothing"
run = "tools/release.sh changelog"

[tasks.release]
description = "Prepare a release (version bump and changelog section), or tag it with --tag"
usage = '''
arg "<version>" help="Semver version without the v, e.g. 0.2.0"
flag "--dry-run" help="Run the checks and print the plan; write nothing"
flag "--tag" help="Tag and push v<version> from an up-to-date main (asks first)"
'''
run = '''
mode=prepare
[ "${usage_tag:-false}" = true ] && mode=tag
tools/release.sh "$mode" "$usage_version" "${usage_dry_run:-false}"
'''

[tasks.gen-vaapi-sys]
description = "Regenerate the libva bindings (Linux, needs libva headers and clang)"
run = "tools/gen-vaapi-sys.sh > src/encode/vaapi/sys.rs"
