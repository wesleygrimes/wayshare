name: Headless smoke

on:
  workflow_dispatch:
  push:
    branches: [wes/headless-ci-smoke]

permissions:
  contents: read

concurrency:
  group: headless-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_DISABLE_TOOLS: cargo:bindgen-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libegl-dev libgbm-dev
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Build wayshare
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/headless-artifacts/software-drm"
          mise run build 2>&1 | tee "$RUNNER_TEMP/headless-artifacts/build.log"
      - name: Check software DRM support on the runner
        run: |
          {
            uname -a
            grep -E 'CONFIG_DRM_(VKMS|VGEM)|CONFIG_UDMABUF' "/boot/config-$(uname -r)" || true
            apt-cache policy "linux-modules-extra-$(uname -r)"
            if [[ -d /dev/dri ]]; then ls -l /dev/dri; else echo 'No /dev/dri on the runner.'; fi
            for driver in vkms vgem udmabuf; do
              echo "Trying software DRM driver $driver"
              sudo modprobe "$driver" || true
            done
            if [[ -d /dev/dri ]]; then ls -l /dev/dri; else echo 'Still no /dev/dri on the runner.'; fi
          } 2>&1 | tee "$RUNNER_TEMP/headless-artifacts/runner-drm.log"
      - name: Capture Hyprland and check RDP without a GPU
        continue-on-error: true
        run: |
          # No devices, host display sockets, privileged mode, or published ports.
          docker run --rm --name wayshare-headless \
            --env GITHUB_ACTIONS=true \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/headless-artifacts,dst=/artifacts" \
            archlinux:latest bash /work/tools/headless-smoke.sh
      - name: Try software DRM devices without a physical GPU
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          devices=()
          while IFS= read -r node; do devices+=(--device "$node"); done \
            < <(bash "$GITHUB_WORKSPACE/tools/headless-smoke.sh" --list-software-devices)
          if [[ -c /dev/udmabuf ]]; then devices+=(--device /dev/udmabuf); fi
          mkdir -p "$RUNNER_TEMP/headless-artifacts/software-drm"
          if (( ${#devices[@]} == 0 )); then
            echo 'No software DRM devices available.' | tee "$RUNNER_TEMP/headless-artifacts/software-drm/result.txt"
            exit 1
          fi
          docker run --rm --name wayshare-software-drm \
            "${devices[@]}" --env GITHUB_ACTIONS=true --env WAYSHARE_SOFTWARE_DRM=true \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/headless-artifacts/software-drm,dst=/artifacts" \
            archlinux:latest bash /work/tools/headless-smoke.sh
      - name: Upload diagnostics and received frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-artifacts
          if-no-files-found: warn
          retention-days: 14
