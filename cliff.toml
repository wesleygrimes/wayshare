# Release notes for wayshare. Run through `mise run changelog` and `mise run release`.
# Only commits after the latest v* tag are read. See docs/releasing.md.

[changelog]
header = ""
footer = ""
trim = true
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits | unique(attribute="message") -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% if not commit.message is containing("(#") %} ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})){% endif %}
{% if commit.breaking and commit.breaking_description != commit.message %}\
{% for line in commit.breaking_description | trim | split(pat="\n") %}\
{% if line | trim %}  {{ line | trim_end }}{% endif %}
{% endfor %}\
{% endif %}\
{% endfor %}\
{% endfor %}\
{% set authors = commits | map(attribute="author.name") | unique %}\
{% if authors | length > 1 %}
Thanks to {{ authors | join(sep=", ") }}.
{% endif %}\
{% if previous.version %}
**Full changelog**: [{{ previous.version }}...{{ version | default(value="HEAD") }}]($REPO/compare/{{ previous.version }}...{{ version | default(value="HEAD") }})
{% endif %}\
"""
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#$1](https://github.com/wesleygrimes/wayshare/pull/$1))" },
  { pattern = '\$REPO', replace = "https://github.com/wesleygrimes/wayshare" },
]

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
# Group names carry a sort prefix; group_by orders by name and the heading strips it.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = '^chore\(release\)', skip = true },
  { message = '^[a-z]+\(security\)', group = "<!-- 2 -->Fixes" },
  { message = '^(feat|fix|build|chore|ci)\(deps', group = "<!-- 6 -->Maintenance" },
  { message = '^feat', group = "<!-- 1 -->Features" },
  { message = '^fix', group = "<!-- 2 -->Fixes" },
  { message = '^perf', group = "<!-- 3 -->Performance" },
  { message = '^docs?', group = "<!-- 4 -->Documentation" },
  { message = '^(ci|build|chore|test|style|refactor|revert)', group = "<!-- 6 -->Maintenance" },
  { message = '.*', group = "<!-- 6 -->Maintenance" },
]
