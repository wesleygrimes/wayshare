# $XDG_CONFIG_HOME/wayshare/config.toml (usually ~/.config/wayshare/config.toml).
# Every key is optional; the values shown are the defaults unless noted.

listen = "0.0.0.0:5900"               # one address, e.g. Tailscale's, to listen only there
# name = "omarchy"                    # default: the host name
# srp_file = "/home/alice/.config/wayshare/srp-alice"   # default: srp-$USER next to this file
# output = "DP-1"                     # default: the only enabled monitor
resize = true                         # match the viewer's display mode, restore afterwards
exclusive = false                     # disable other monitors while viewers are connected

[hp]
enabled = true
port = 5960                           # video; audio uses port + 2
# bitrate = 40000000
encoder = "auto"                      # auto | vaapi | x265
chroma = "420"                        # "444" needs encoder = "x265"
audio = true                          # stream the default sink monitor (AAC-ELD)

[rdp]
codec = "auto"                        # auto | h264 | remotefx; h264 also permits fallback
enabled = true                        # TLS and shared Apple login; false turns RDP off
# listen = "100.64.0.1:3389"           # unset: the RFB listen address on port 3389
# Set a LAN or Tailscale address to restrict access. RDP requires a readable SRP record.
# SRP or TLS identity errors leave RDP off while Apple RFB keeps listening.
# Setup offers ufw rules for both ports. Existing setups must allow TCP 3389 or rerun setup.
# Compare the logged SHA-256 colon-hex fingerprint
# with the client's certificate details before sending your wayshare password.
# identity_file = "/home/alice/.config/wayshare/rdp-identity.pem"

[input]
enabled = true
command_key = "super"                 # super (Omarchy binds) | ctrl | alt | altgr
option_key = "alt"
layout = "us"
variant = ""

[mdns]
enabled = true
# device_model = "MacPro7,1"          # Finder icon
