[package]
name = "wayshare"
version = "0.2.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[[bench]]
name = "media"
harness = false

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16"
demand = "2.4.1"
flate2 = "1.1.10"
hmac = "0.13.0"
md-5 = "0.11.0"
mdns-sd = "0.21.5"
num-bigint = "0.5.1"
pbkdf2 = "0.13.0"
plist = "1.10.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"
subtle = "2.6.1"
termcolor = "1.4"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
gbm = { version = "0.18", default-features = false }
glow = "0.18"
khronos-egl = { version = "6", features = ["static"] }
libc = "0.2.190"
libloading = "0.9.0"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
strip = true
